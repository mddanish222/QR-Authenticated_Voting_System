
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a56db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VoterScan">
<link rel="apple-touch-icon" href="/logo.png">
<title>Election Results</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS — matches publish.html palette
═══════════════════════════════════════════ */
:root {
  --text-xs  : 0.72rem;
  --text-sm  : 0.875rem;
  --text-base: 1rem;

  --glass-card  : rgba(255,255,255,0.82);
  --glass-inner : rgba(255,255,255,0.70);
  --glass-border: rgba(255,255,255,0.90);

  --clr-bg    : #f0f2f7;
  --clr-text  : #0f172a;
  --clr-muted : #64748b;
  --clr-gold  : #d97706;
  --clr-gold2 : #f59e0b;
  --clr-gold3 : #fef3c7;
  --clr-line  : rgba(100,130,180,0.18);

  --res-accent: #1a1a2e;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  color: var(--clr-text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  background: var(--clr-bg) url('bg.png') center/cover fixed;
}

/* ═══════════════════════════════════════════
   CONFETTI CANVAS
═══════════════════════════════════════════ */
#confettiCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 999;
}

/* ═══════════════════════════════════════════
   LOADING
═══════════════════════════════════════════ */
.loading-screen {
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}

.loading-ring {
  width: 48px; height: 48px;
  border: 3px solid rgba(100,130,180,0.20);
  border-top-color: var(--clr-gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════
   NOT PUBLISHED
═══════════════════════════════════════════ */
.not-published {
  display: none;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  text-align: center;
  padding: 24px;
}

.not-published.show { display: flex; }

.np-icon  { font-size: clamp(44px,10vw,64px); margin-bottom: 8px; }

.np-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(20px,4vw,28px);
  font-weight: 800;
  color: var(--clr-text);
}

.np-sub {
  font-size: var(--text-sm);
  color: var(--clr-muted);
  max-width: 360px;
}

/* ═══════════════════════════════════════════
   MAIN PAGE
═══════════════════════════════════════════ */
#resultPage { display: none; }
#resultPage.show { display: block; }

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.result-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px) saturate(2);
  -webkit-backdrop-filter: blur(20px) saturate(2);
  border-bottom: 1px solid var(--clr-line);
  padding: 0 clamp(16px,4%,32px);
  height: clamp(52px,9vw,64px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: clamp(10px,2vw,16px);
  box-shadow: 0 2px 16px rgba(15,23,42,0.07);
}

.header-left { display: flex; flex-direction: column; }

.header-college {
  font-family: 'Syne', sans-serif;
  font-size: clamp(13px,2.5vw,17px);
  font-weight: 700;
  color: var(--clr-text);
}

.header-meta {
  font-family: 'DM Mono', monospace;
  font-size: var(--text-xs);
  color: var(--clr-muted);
  margin-top: 1px;
}

.btn-download {
  background: linear-gradient(135deg, var(--res-accent), #2d2d5e);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: clamp(8px,1.5vw,10px) clamp(14px,2.5vw,20px);
  font-size: var(--text-sm);
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
  min-height: 44px;
  box-shadow: 0 4px 14px rgba(26,26,46,0.22);
}
.btn-download:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,26,46,0.32); }

/* ═══════════════════════════════════════════
   PAGE CONTENT
═══════════════════════════════════════════ */
.page {
  max-width: min(100%, 860px);
  margin: 0 auto;
  padding: clamp(28px,5vw,48px) clamp(14px,4%,24px) clamp(40px,7vw,80px);
}

/* ═══════════════════════════════════════════
   GLASS CARD
═══════════════════════════════════════════ */
.glass-card {
  background: var(--glass-card);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.55) inset,
    0 8px 32px rgba(15,23,42,0.08),
    0 2px 8px rgba(15,23,42,0.05);
  position: relative;
  overflow: hidden;
}
.glass-card::before {
  content: '';
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.90), transparent);
  pointer-events: none;
}

/* ═══════════════════════════════════════════
   COLLEGE TITLE
═══════════════════════════════════════════ */
.college-title {
  text-align: center;
  margin-bottom: clamp(28px,5vw,48px);
  animation: fadeUp 0.5s ease both;
}

.election-eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: var(--text-xs);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--clr-muted);
  margin-bottom: 10px;
}

.college-name-big {
  font-family: 'Syne', sans-serif;
  font-size: clamp(20px,4.5vw,40px);
  font-weight: 800;
  letter-spacing: clamp(2px,0.6vw,3px);
  text-transform: uppercase;
  color: var(--clr-text);
  margin-bottom: 12px;
}

.election-divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--clr-gold), transparent);
  margin: 0 auto;
}

/* ═══════════════════════════════════════════
   WINNER SECTION
═══════════════════════════════════════════ */
.winner-section {
  text-align: center;
  margin-bottom: clamp(28px,5vw,48px);
  animation: fadeUp 0.6s ease 0.1s both;
}

.winner-outer-card {
  background: var(--glass-card);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: clamp(28px,5vw,52px) clamp(20px,5vw,48px) clamp(24px,4vw,40px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.55) inset,
    0 8px 40px rgba(15,23,42,0.10),
    0 0 80px rgba(217,119,6,0.07);
  position: relative;
  overflow: hidden;
}

.winner-outer-card::after {
  content: '';
  position: absolute;
  top: -60px; left: 50%; transform: translateX(-50%);
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%);
  pointer-events: none;
}

/* ── Crown header row ── */
.crown-header-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(12px,3vw,28px);
  margin-bottom: clamp(20px,4vw,36px);
}

.crown-icon {
  font-size: clamp(36px,8vw,60px);
  filter: drop-shadow(0 4px 16px rgba(217,119,6,0.55));
  animation: crownFloat 3s ease-in-out infinite;
  line-height: 1;
}

.winner-label-text {
  font-family: 'Syne', sans-serif;
  font-size: clamp(18px,4vw,32px);
  font-weight: 800;
  letter-spacing: clamp(3px,1vw,7px);
  text-transform: uppercase;
  background: linear-gradient(135deg, #78450a, #d97706, #f59e0b, #d97706, #78450a);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmerText 3s linear infinite;
}

@keyframes shimmerText {
  to { background-position: 200% center; }
}

@keyframes crownFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}

/* ── Photo ring ── */
.winner-photo-ring {
  position: relative;
  width: clamp(160px,38vw,240px);
  height: clamp(160px,38vw,240px);
  margin: 0 auto clamp(20px,4vw,32px);
}

.winner-photo-ring::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: conic-gradient(var(--clr-gold2), #fde68a, var(--clr-gold), #fde68a, var(--clr-gold2));
  animation: rotateBorder 4s linear infinite;
  z-index: 0;
}

.winner-photo-ring::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  background: var(--clr-bg);
  z-index: 1;
}

@keyframes rotateBorder { to { transform: rotate(360deg); } }

.winner-photo {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

.winner-no-photo {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(56px,14vw,90px);
}

/* ── Winner glow ── */
.winner-glow {
  position: absolute;
  inset: -30px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245,158,11,0.28) 0%, transparent 70%);
  animation: glowPulse 2.5s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

@keyframes glowPulse {
  0%,100% { opacity: 0.5; transform: scale(1); }
  50%     { opacity: 1;   transform: scale(1.08); }
}

/* ── Winner info ── */
.winner-name {
  font-family: 'Syne', sans-serif;
  font-size: clamp(22px,5.5vw,38px);
  font-weight: 800;
  color: var(--clr-text);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
  animation: fadeUp 0.6s ease 0.4s both;
}

.winner-votes-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--clr-gold3);
  border: 1.5px solid rgba(217,119,6,0.35);
  border-radius: 24px;
  padding: 8px clamp(16px,3vw,28px);
  font-family: 'DM Mono', monospace;
  font-size: clamp(14px,3vw,18px);
  font-weight: 500;
  color: var(--clr-gold);
  margin-bottom: 8px;
  animation: fadeUp 0.6s ease 0.5s both;
}

.winner-pct {
  font-family: 'DM Mono', monospace;
  font-size: var(--text-sm);
  color: var(--clr-muted);
  animation: fadeUp 0.6s ease 0.6s both;
}

/* ── Tie ── */
.tie-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--clr-gold3);
  border: 1px solid var(--clr-gold2);
  border-radius: 10px;
  padding: 7px 18px;
  font-size: var(--text-sm);
  color: var(--clr-gold);
  font-weight: 700;
  margin-bottom: 28px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 1px;
}

.tie-winners {
  display: flex;
  justify-content: center;
  gap: clamp(16px,4vw,36px);
  flex-wrap: wrap;
  margin-bottom: 16px;
}

/* ═══════════════════════════════════════════
   OTHERS SECTION
═══════════════════════════════════════════ */
.others-section {
  margin-bottom: clamp(24px,4vw,40px);
  animation: fadeUp 0.6s ease 0.2s both;
}

.others-title {
  font-family: 'DM Mono', monospace;
  font-size: var(--text-xs);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--clr-muted);
  text-align: center;
  margin-bottom: 20px;
}

.others-grid {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: clamp(10px,2.5vw,18px);
}

.other-card {
  background: var(--glass-inner);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: clamp(12px,2.5vw,16px) clamp(14px,2.5vw,18px);
  text-align: center;
  opacity: 0.6;
  filter: grayscale(20%);
  transition: opacity 0.2s;
  animation: fadeUp 0.5s ease both;
  min-width: 90px;
}
.other-card:hover { opacity: 0.8; }

.other-photo-wrap {
  width: clamp(60px,13vw,88px);
  height: clamp(60px,13vw,88px);
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 10px;
  border: 2px solid var(--clr-line);
  background: rgba(255,255,255,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px,5vw,30px);
}
.other-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }

.other-name  { font-family: 'Syne', sans-serif; font-size: var(--text-sm); font-weight: 700; color: var(--clr-text); margin-bottom: 2px; }
.other-votes { font-family: 'DM Mono', monospace; font-size: var(--text-xs); color: var(--clr-muted); }

/* ═══════════════════════════════════════════
   DIVIDER
═══════════════════════════════════════════ */
.fancy-divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: clamp(20px,4vw,36px) 0;
}
.fancy-divider::before,
.fancy-divider::after { content: ''; flex: 1; height: 1px; background: var(--clr-line); }
.fancy-divider span { font-size: 18px; }

/* ═══════════════════════════════════════════
   CHART SECTION
═══════════════════════════════════════════ */
.chart-section {
  margin-bottom: clamp(24px,4vw,40px);
  animation: fadeUp 0.6s ease 0.3s both;
}

.chart-section-inner {
  background: var(--glass-card);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: clamp(20px,4vw,36px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.55) inset,
    0 8px 32px rgba(15,23,42,0.08);
}

.chart-head {
  margin-bottom: clamp(16px,3vw,24px);
  text-align: center;
}

.chart-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(15px,3vw,20px);
  font-weight: 800;
  color: var(--clr-text);
  margin-bottom: 4px;
}

.chart-sub { font-size: var(--text-sm); color: var(--clr-muted); }

.chart-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(20px,4vw,36px);
  align-items: center;
}

.chart-wrap {
  position: relative;
  max-width: 280px;
  margin: 0 auto;
  width: 100%;
}

.chart-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  pointer-events: none;
}

.chart-center-num {
  font-family: 'Syne', sans-serif;
  font-size: clamp(22px,5vw,32px);
  font-weight: 800;
  color: var(--clr-text);
  line-height: 1;
}

.chart-center-label {
  font-family: 'DM Mono', monospace;
  font-size: var(--text-xs);
  color: var(--clr-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

.chart-legend { display: flex; flex-direction: column; gap: clamp(8px,1.5vw,12px); }

.legend-row { display: flex; align-items: center; gap: clamp(8px,1.5vw,12px); }
.legend-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

.legend-info { flex: 1; min-width: 0; }
.legend-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--clr-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.legend-bar-wrap { height: 4px; background: var(--clr-line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.legend-bar      { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

.legend-stat { text-align: right; flex-shrink: 0; }
.legend-votes { font-family: 'DM Mono', monospace; font-size: var(--text-sm); font-weight: 500; color: var(--clr-text); }
.legend-pct   { font-family: 'DM Mono', monospace; font-size: var(--text-xs); color: var(--clr-muted); }

/* ═══════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════ */
.result-footer {
  text-align: center;
  padding-top: 24px;
  border-top: 1px solid var(--clr-line);
  font-family: 'DM Mono', monospace;
  font-size: var(--text-xs);
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #b0b8c8;
}

/* ═══════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════
   STORY DOWNLOAD AREA (hidden, portrait 9:16)
═══════════════════════════════════════════ */
#storyDownloadArea {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 1080px;
  background: #0f0f1a;
  padding: 0;
  overflow: hidden;
  z-index: -1;
}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (max-width: 600px) {
  .chart-layout { grid-template-columns: 1fr; }
  .result-header { padding: 0 14px; }
  .tie-winners { gap: 20px; }
}

@media (max-width: 380px) {
  .others-grid { gap: 8px; }
}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-ring"></div>
  <div style="font-size:14px;color:#64748b;font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;">Loading results…</div>
</div>

<!-- NOT PUBLISHED -->
<div class="not-published" id="notPublished">
  <div class="np-icon">🔒</div>
  <div class="np-title">Results Not Yet Published</div>
  <p class="np-sub">The election results have not been released yet. Please check back later.</p>
</div>

<!-- RESULT PAGE -->
<div id="resultPage">

  <header class="result-header">
    <div class="header-left">
      <div class="header-college" id="headerCollege">—</div>
      <div class="header-meta" id="headerMeta">—</div>
    </div>
    <button class="btn-download" id="downloadBtn">⬇ &nbsp;Download</button>
  </header>

  <div id="downloadArea">
    <div class="page">

      <!-- COLLEGE TITLE -->
      <div class="college-title">
        <div class="election-eyebrow">Official Election Results</div>
        <div class="college-name-big" id="collegeName">—</div>
        <div class="election-divider"></div>
      </div>

      <!-- WINNER -->
      <div class="winner-section" id="winnerSection"></div>

      <!-- OTHERS -->
      <div class="others-section" id="othersSection"></div>

      <!-- DIVIDER -->
      <div class="fancy-divider"><span>🗳️</span></div>

      <!-- CHART -->
      <div class="chart-section">
        <div class="chart-section-inner">
          <div class="chart-head">
            <div class="chart-title">Vote Distribution</div>
            <div class="chart-sub" id="chartSub">—</div>
          </div>
          <div class="chart-layout">
            <div class="chart-wrap">
              <canvas id="pieChart"></canvas>
              <div class="chart-center">
                <div class="chart-center-num" id="chartTotal">0</div>
                <div class="chart-center-label">Total Votes</div>
              </div>
            </div>
            <div class="chart-legend" id="chartLegend"></div>
          </div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="result-footer" id="resultFooter">
        Smart Voting Authentication System &nbsp;•&nbsp; Official Results
      </div>

    </div>
  </div>
</div>

<!-- ═══ HIDDEN STORY CANVAS (for download) ═══ -->
<div id="storyDownloadArea"></div>

<script type="module">
const API = 'https://qr-authenticated-voting-system.onrender.com'

/* ── URL PARAMS ── */
const params     = new URLSearchParams(window.location.search)
const GROUP_ID   = params.get('group')
const STUDENT_ID = params.get('id') || ''

const COLORS = ['#d97706','#6366f1','#16a34a','#dc2626','#7c3aed','#db2777','#0891b2','#f59e0b']

/* ── publish date set at download time ── */
let publishedAt = null

/* ══════════════════════════════════
   INIT
══════════════════════════════════ */
window.addEventListener('load', init)

async function init() {
  if (!GROUP_ID) { showNotPublished(); return }

  try {
    const res  = await fetch(`${API}/api/results/${GROUP_ID}?id=${encodeURIComponent(STUDENT_ID)}`)
    const data = await res.json()
    if (!res.ok) { showNotPublished(); return }
    await showResults(data.group, data.candidates)
  } catch (e) {
    showNotPublished()
  }
}

/* ══════════════════════════════════
   SHOW RESULTS
══════════════════════════════════ */
async function showResults(group, candidates) {
  if (!candidates || candidates.length === 0) { showNotPublished(); return }

  const totalVotes = candidates.reduce((sum, c) => sum + (c.vote_count || 0), 0)
  const college    = group.college.toUpperCase()

  document.getElementById('headerCollege').textContent = college
  document.getElementById('collegeName').textContent   = college
  document.getElementById('headerMeta').textContent    =
    'Year ' + group.year + ' • Sem ' + group.semester + ' • Sec ' + group.section
  document.getElementById('resultFooter').textContent  =
    college + ' • Smart Voting Authentication System • Official Results'
  document.getElementById('chartSub').textContent      =
    'Total ' + totalVotes + ' votes cast across ' + candidates.length + ' candidates'
  document.getElementById('chartTotal').textContent    = totalVotes

  const maxVotes = candidates[0].vote_count || 0
  const winners  = candidates.filter(c => c.vote_count === maxVotes && maxVotes > 0)
  const others   = candidates.filter(c => c.vote_count !== maxVotes || maxVotes === 0)

  buildWinnerSection(winners, totalVotes)
  buildOthersSection(others, totalVotes)
  buildChart(candidates, totalVotes)

  document.getElementById('loadingScreen').style.display = 'none'
  document.getElementById('resultPage').classList.add('show')

  if (maxVotes > 0) setTimeout(launchConfetti, 400)
}

/* ══════════════════════════════════
   WINNER SECTION
══════════════════════════════════ */
function buildWinnerSection(winners, total) {
  const section = document.getElementById('winnerSection')
  const isTie   = winners.length > 1

  if (isTie) {
    let html = `
      <div class="winner-outer-card">
        <div class="crown-header-row">
          <span class="crown-icon">👑</span>
          <span class="winner-label-text">Winner</span>
          <span class="crown-icon">👑</span>
        </div>
        <div class="tie-badge">⚖️ &nbsp;TIE — ${winners.length} candidates share the top position</div>
        <div class="tie-winners">`

    winners.forEach((w, i) => {
      const pct     = total > 0 ? Math.round((w.vote_count || 0) / total * 100) : 0
      const proxiedWinner = w.photo_url
      ? w.photo_url.match(/\/storage\/v1\/object\/(?:sign|public)\/voting-images\/(.+?)(\?|$)/)
        ? `${API}/api/image/${w.photo_url.match(/\/storage\/v1\/object\/(?:sign|public)\/voting-images\/(.+?)(\?|$)/)[1]}`
        : w.photo_url
      : null
    const photoEl = proxiedWinner
      ? `<img class="winner-photo" src="${proxiedWinner}" alt="${w.name}">`
      : `<div class="winner-no-photo">👤</div>`

      html += `
        <div style="text-align:center">
          <div style="position:relative;width:clamp(130px,28vw,180px);margin:0 auto 16px">
            <div class="winner-glow"></div>
            <div class="winner-photo-ring" style="width:clamp(130px,28vw,180px);height:clamp(130px,28vw,180px)">
              ${photoEl}
            </div>
          </div>
          <div class="winner-name" style="font-size:clamp(18px,4vw,26px)">${w.name}</div>
          <div class="winner-votes-badge">🗳️ &nbsp;${w.vote_count || 0} votes</div>
          <div class="winner-pct">${pct}% of total votes</div>
        </div>`
    })

    html += `</div></div>`
    section.innerHTML = html

  } else if (winners.length === 1) {
    const w       = winners[0]
    const pct     = total > 0 ? Math.round((w.vote_count || 0) / total * 100) : 0
    const proxiedWinner = w.photo_url
      ? w.photo_url.match(/\/storage\/v1\/object\/(?:sign|public)\/voting-images\/(.+?)(\?|$)/)
        ? `${API}/api/image/${w.photo_url.match(/\/storage\/v1\/object\/(?:sign|public)\/voting-images\/(.+?)(\?|$)/)[1]}`
        : w.photo_url
      : null
    const photoEl = proxiedWinner
      ? `<img class="winner-photo" src="${proxiedWinner}" alt="${w.name}">`
      : `<div class="winner-no-photo">👤</div>`

    section.innerHTML = `
      <div class="winner-outer-card">
        <div class="crown-header-row">
          <span class="crown-icon">👑</span>
          <span class="winner-label-text">Winner</span>
          <span class="crown-icon">👑</span>
        </div>
        <div style="position:relative;width:clamp(160px,38vw,240px);margin:0 auto clamp(20px,4vw,32px)">
          <div class="winner-glow"></div>
          <div class="winner-photo-ring">
            ${photoEl}
          </div>
        </div>
        <div class="winner-name">${w.name}</div>
        <div class="winner-votes-badge">🗳️ &nbsp;${w.vote_count || 0} Votes</div>
        <div class="winner-pct">${pct}% of total votes</div>
      </div>
    `
  } else {
    section.innerHTML = `
      <div class="winner-outer-card">
        <div class="winner-label-text" style="font-size:18px;display:block;margin-bottom:8px">No votes recorded yet</div>
      </div>`
  }
}

/* ══════════════════════════════════
   OTHERS SECTION
══════════════════════════════════ */
function buildOthersSection(others, total) {
  const section = document.getElementById('othersSection')
  if (!others || others.length === 0) { section.style.display = 'none'; return }

  const grid = others.map((c, i) => {
    const votes   = c.vote_count || 0
    const pct     = total > 0 ? Math.round(votes / total * 100) : 0
    const proxiedOther = c.photo_url
      ? c.photo_url.match(/\/storage\/v1\/object\/(?:sign|public)\/voting-images\/(.+?)(\?|$)/)
        ? `${API}/api/image/${c.photo_url.match(/\/storage\/v1\/object\/(?:sign|public)\/voting-images\/(.+?)(\?|$)/)[1]}`
        : c.photo_url
      : null
    const photoEl = proxiedOther
      ? `<img src="${proxiedOther}" alt="${c.name}">`
      : `👤`

    return `
      <div class="other-card" style="animation-delay:${0.1 * i}s">
        <div class="other-photo-wrap">${photoEl}</div>
        <div class="other-name">${c.name}</div>
        <div class="other-votes">${votes} votes · ${pct}%</div>
      </div>`
  }).join('')

  section.innerHTML = `
    <div class="others-title">Other Candidates</div>
    <div class="others-grid">${grid}</div>
  `
}

/* ══════════════════════════════════
   PIE CHART
══════════════════════════════════ */
function buildChart(candidates, total) {
  const labels = candidates.map(c => c.name)
  const data   = candidates.map(c => c.vote_count || 0)
  const colors = candidates.map((_, i) => COLORS[i % COLORS.length])

  const ctx = document.getElementById('pieChart').getContext('2d')
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor:  colors,
        borderColor:      'rgba(255,255,255,0.75)',
        borderWidth:      3,
        hoverBorderWidth: 3,
        hoverOffset:      8
      }]
    },
    options: {
      cutout: '65%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = total > 0 ? Math.round(ctx.parsed / total * 100) : 0
              return `  ${ctx.label}: ${ctx.parsed} votes (${pct}%)`
            }
          },
          backgroundColor: 'rgba(255,255,255,0.92)',
          titleColor:      '#0f172a',
          bodyColor:       '#475569',
          borderColor:     'rgba(100,130,180,0.28)',
          borderWidth:     1,
          padding:         10,
          cornerRadius:    8
        }
      },
      animation: { duration: 1000, easing: 'easeInOutQuart' }
    }
  })

  document.getElementById('chartLegend').innerHTML = candidates.map((c, i) => {
    const votes = c.vote_count || 0
    const pct   = total > 0 ? Math.round(votes / total * 100) : 0
    const color = COLORS[i % COLORS.length]

    return `
      <div class="legend-row">
        <div class="legend-color" style="background:${color}"></div>
        <div class="legend-info">
          <div class="legend-name">${c.name}</div>
          <div class="legend-bar-wrap">
            <div class="legend-bar" style="width:${pct}%;background:${color}"></div>
          </div>
        </div>
        <div class="legend-stat">
          <div class="legend-votes">${votes}</div>
          <div class="legend-pct">${pct}%</div>
        </div>
      </div>`
  }).join('')
}

/* ══════════════════════════════════
   INFINITE CONFETTI
══════════════════════════════════ */
let confettiRunning = false
let confettiRAF     = null

function launchConfetti() {
  if (confettiRunning) return
  confettiRunning = true

  const canvas  = document.getElementById('confettiCanvas')
  const ctx     = canvas.getContext('2d')

  function resize() {
    canvas.width  = window.innerWidth
    canvas.height = window.innerHeight
  }
  resize()
  window.addEventListener('resize', resize)

  const colors = ['#f59e0b','#6366f1','#22d3a5','#f43f5e','#a78bfa','#fde68a','#d97706','#34d399']
  const pieces = []

  for (let i = 0; i < 180; i++) {
    pieces.push({
      x:      Math.random() * canvas.width,
      y:      Math.random() * -canvas.height * 1.5,
      w:      Math.random() * 10 + 5,
      h:      Math.random() * 5  + 3,
      color:  colors[Math.floor(Math.random() * colors.length)],
      speed:  Math.random() * 3  + 1.5,
      angle:  Math.random() * 360,
      spin:   Math.random() * 6  - 3,
      wobble: Math.random() * 0.08 + 0.01,
      frame:  Math.floor(Math.random() * 100)
    })
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)

    pieces.forEach(p => {
      p.y     += p.speed
      p.angle += p.spin
      p.x     += Math.sin(p.frame * p.wobble) * 0.8
      p.frame++

      if (p.y > canvas.height + 20) {
        p.y     = -20
        p.x     = Math.random() * canvas.width
        p.speed = Math.random() * 3 + 1.5
        p.frame = 0
      }

      ctx.save()
      ctx.translate(p.x + p.w / 2, p.y + p.h / 2)
      ctx.rotate(p.angle * Math.PI / 180)
      ctx.fillStyle = p.color
      ctx.globalAlpha = 0.88
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h)
      ctx.restore()
    })

    confettiRAF = requestAnimationFrame(draw)
  }

  draw()
}

/* ══════════════════════════════════

  document.getElementById('notPublished').classList.add('show')
}

/* ══════════════════════════════════
   FORMAT PUBLISH DATE
══════════════════════════════════ */
function formatPublishDate(isoString) {
  try {
    const d = isoString ? new Date(isoString) : new Date()
    const day   = d.getDate().toString().padStart(2,'0')
    const month = d.toLocaleString('en-IN', { month: 'long' }).toUpperCase()
    const year  = d.getFullYear()
    const time  = d.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase()
    return `${day} ${month} ${year}  ·  ${time}`
  } catch {
    return new Date().toDateString().toUpperCase()
  }
}

    btn.disabled    = false
  }
})
</script>
</body>
