
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a56db">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VoterScan">
<link rel="apple-touch-icon" href="/logo.png">
<title>Vote Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root {
  --text-xs  : 0.72rem;
  --text-sm  : 0.875rem;
  --text-base: 1rem;

  --clr-text   : #0f172a;
  --clr-muted  : #64748b;
  --clr-blue   : #1a56db;
  --clr-green  : #059669;
  --clr-red    : #dc2626;
  --clr-purple : #6366f1;
  --clr-purple2: #818cf8;
  --clr-gold   : #f59e0b;

  --glass-card  : rgba(255,255,255,0.78);
  --glass-border: rgba(255,255,255,0.92);
  --input-bg    : rgba(255,255,255,0.62);
  --input-border: rgba(100,130,180,0.28);
  --valid       : #059669;
  --invalid     : #dc2626;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  color: var(--clr-text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  /* original light background kept */
  background: #f0f2f7 url('bgg.png') center/cover fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: clamp(16px,3vw,24px) clamp(14px,4vw,20px) clamp(24px,4vw,40px);
}

/* ── PAGE ── */
.page {
  width: 100%;
  max-width: min(100%, 520px);
  animation: pageIn .75s cubic-bezier(.16,1,.3,1) both;
}
@keyframes pageIn {
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ══════════════════════════════
   HEADER — fully redesigned
══════════════════════════════ */
.header {
  text-align: center;
  margin-bottom: clamp(14px,2.5vw,20px);
}

/* glowing emblem badge */
.emblem-wrap {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
  position: relative;
}

.emblem {
  width: clamp(44px,8vw,56px);
  height: clamp(44px,8vw,56px);
  border-radius: 50%;
  background: linear-gradient(135deg, #6366f1 0%, #1a56db 100%);
  box-shadow:
    0 0 0 4px rgba(99,102,241,0.15),
    0 0 28px rgba(99,102,241,0.45),
    0 0 56px rgba(99,102,241,0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(24px,5vw,32px);
  animation: emblemPop 3.5s ease-in-out infinite;
}

@keyframes emblemPop {
  0%,100%{ box-shadow:0 0 0 4px rgba(99,102,241,0.15),0 0 28px rgba(99,102,241,0.45),0 0 56px rgba(99,102,241,0.18); }
  50%    { box-shadow:0 0 0 8px rgba(99,102,241,0.10),0 0 44px rgba(99,102,241,0.60),0 0 80px rgba(99,102,241,0.22); }
}

/* pulse ring around emblem */
.emblem-wrap::after {
  content:'';
  position:absolute;
  inset:-8px;
  border-radius:50%;
  border:1.5px solid rgba(99,102,241,0.30);
  animation: ringPulse 3.5s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100%{ transform:scale(1); opacity:.6; }
  50%    { transform:scale(1.08); opacity:.2; }
}

/* main headline */
.header h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(28px,6vw,42px);
  font-weight: 800;
  line-height: .92;
  letter-spacing: -2px;
  color: #0f172a;
  margin-bottom: 8px;
}

.header h1 .line1 {
  display: block;
  color: #0f172a;
}

.header h1 .line2 {
  display: block;
  background: linear-gradient(130deg, #6366f1 0%, #818cf8 40%, #f59e0b 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  background-size: 200% auto;
  animation: shimmerText 4s linear infinite;
}

@keyframes shimmerText {
  0%  { background-position: 0% center; }
  100%{ background-position: 200% center; }
}

/* sub tagline with decorative lines */
.tagline-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 6px;
}

.tagline-line {
  flex: 1;
  max-width: 60px;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(99,102,241,0.40));
  border-radius: 99px;
}
.tagline-line.r {
  background: linear-gradient(90deg, rgba(99,102,241,0.40), transparent);
}

.tagline {
  font-size: var(--text-xs);
  color: var(--clr-muted);
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
}

/* animated dots row */
.dots-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

.dot-badge {
  width: 7px; height: 7px;
  border-radius: 50%;
  animation: dotBlink 2.4s ease-in-out infinite;
}
.dot-badge:nth-child(1){ background:#6366f1; animation-delay:0s; }
.dot-badge:nth-child(2){ background:#818cf8; animation-delay:.3s; }
.dot-badge:nth-child(3){ background:#f59e0b; animation-delay:.6s; }
.dot-badge:nth-child(4){ background:#818cf8; animation-delay:.9s; }
.dot-badge:nth-child(5){ background:#6366f1; animation-delay:1.2s; }

@keyframes dotBlink {
  0%,100%{ opacity:.25; transform:scale(.8); }
  50%    { opacity:1;   transform:scale(1.2); }
}

/* ══════════════════════════════
   ADMIN CODE
══════════════════════════════ */
.admin-code-section {
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid rgba(255,255,255,0.75);
  border-radius: 14px;
  padding: clamp(10px,2vw,14px) clamp(14px,2.5vw,20px);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: clamp(8px,2vw,14px);
  flex-wrap: wrap;
  min-height: 56px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.80) inset,
    0 2px 0 rgba(255,255,255,0.95) inset,
    0 6px 32px rgba(99,102,241,0.20),
    0 2px 8px rgba(99,102,241,0.10);
  position: relative;
  overflow: hidden;
}

/* top shimmer line on admin box */
.admin-code-section::before {
  content:'';
  position:absolute;
  top:0; left:10%; right:10%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,0.55),transparent);
}

.admin-code-label {
  font-family: 'DM Mono', monospace;
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--clr-muted);
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 36px;
  align-self: center;
}

.admin-code-input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 140px;
  align-self: center;
}
.admin-code-input {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 1.5px solid rgba(99,102,241,0.28);
  outline: none;
  color: var(--clr-text);
  font-family: 'DM Mono', monospace;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 4px 2px;
  transition: border-color 0.2s;
  min-height: 36px;
}
.admin-code-input::placeholder { color:rgba(100,116,139,0.45); font-weight:400; letter-spacing:1px; text-transform:none; }
.admin-code-input:focus { border-bottom-color: var(--clr-purple); }
.admin-code-input:disabled { color:#059669; border-bottom-color:rgba(5,150,105,0.4); cursor:default; }

.lock-icon { font-size:14px; flex-shrink:0; }

.admin-code-status { font-family:'DM Mono',monospace; font-size:var(--text-xs); letter-spacing:1px; flex-shrink:0; }
.admin-code-status.waiting  { color:var(--clr-muted); }
.admin-code-status.locked   { color:#059669; }
.admin-code-status.unlocked { color:#d97706; }
.admin-code-status.error    { color:var(--invalid); }

/* ══════════════════════════════
   MAIN CARD — vibrant glass
══════════════════════════════ */
.card {
  background: rgba(255,255,255,0.42);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  border: 1.5px solid rgba(255,255,255,0.78);
  border-radius: 24px;
  padding: clamp(16px,3.5vw,24px);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.85) inset,
    0 2px 0 rgba(255,255,255,0.95) inset,
    0 8px 40px rgba(99,102,241,0.22),
    0 2px 12px rgba(99,102,241,0.12),
    0 32px 64px rgba(99,102,241,0.08);
  position: relative;
  overflow: hidden;
}

/* colored top border glow */
.card::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:3px;
  background:linear-gradient(90deg, #6366f1, #818cf8, #f59e0b, #818cf8, #6366f1);
  background-size:200% auto;
  animation:borderFlow 4s linear infinite;
}
@keyframes borderFlow {
  0%  { background-position:0% center; }
  100%{ background-position:200% center; }
}

/* inner top shimmer */
.card::after {
  content:'';
  position:absolute;
  top:3px; left:8%; right:8%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.90),transparent);
  pointer-events:none;
}

/* ══════════════════════════════
   TABS
══════════════════════════════ */
.tabs {
  display:flex;
  gap:5px;
  padding:5px;
  background:rgba(99,102,241,0.07);
  border:1px solid rgba(99,102,241,0.15);
  border-radius:13px;
  margin-bottom:20px;
}

.tab {
  flex:1;
  padding:clamp(8px,1.5vw,10px) 12px;
  border:none;
  border-radius:9px;
  background:transparent;
  color:var(--clr-muted);
  font-family:'DM Sans',sans-serif;
  font-size:var(--text-sm);
  font-weight:500;
  cursor:pointer;
  transition:all .25s cubic-bezier(.16,1,.3,1);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:44px;
}
.tab:hover { color:#1e293b; background:rgba(255,255,255,0.50); }
.tab.active {
  background:#ffffff;
  color:var(--clr-purple);
  box-shadow:0 2px 12px rgba(99,102,241,0.18), 0 1px 0 rgba(255,255,255,0.80) inset;
  font-weight:600;
}

/* ══════════════════════════════
   PANELS
══════════════════════════════ */
.panel { display:none; }
.panel.active {
  display:block;
  animation:panelIn .35s cubic-bezier(.16,1,.3,1);
}
@keyframes panelIn {
  from{opacity:0;transform:translateY(8px);}
  to  {opacity:1;transform:translateY(0);}
}

/* ══════════════════════════════
   CAMERA VIEW
══════════════════════════════ */
.cam-wrap {
  position:relative;
  width:100%;
  aspect-ratio:5/4;
  border-radius:18px;
  overflow:hidden;
  background: rgba(235,237,255,0.38);
  border:1.5px solid rgba(255,255,255,0.75);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.85) inset,
    0 2px 0 rgba(255,255,255,0.95) inset,
    0 6px 32px rgba(99,102,241,0.18),
    0 2px 10px rgba(99,102,241,0.10);
}

#videoEl { width:100%; height:100%; object-fit:cover; display:block; }
#canvas  { display:none; }

.cam-idle {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  background: linear-gradient(135deg, rgba(225,228,255,0.55) 0%, rgba(210,218,255,0.45) 50%, rgba(220,226,255,0.50) 100%);
}

.ring {
  width:clamp(68px,13vw,86px);
  height:clamp(68px,13vw,86px);
  border-radius:50%;
  background: linear-gradient(135deg, rgba(99,102,241,0.14), rgba(129,140,248,0.08));
  border:1.5px solid rgba(99,102,241,0.30);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  box-shadow: 0 0 24px rgba(99,102,241,0.20), 0 4px 16px rgba(99,102,241,0.10);
  animation:ringGlow 3s ease-in-out infinite;
}
@keyframes ringGlow {
  0%,100%{ box-shadow:0 0 24px rgba(99,102,241,0.20),0 4px 16px rgba(99,102,241,0.10); }
  50%    { box-shadow:0 0 44px rgba(99,102,241,0.42),0 4px 28px rgba(99,102,241,0.22); }
}

.ring::before {
  content:'';
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:1px dashed rgba(99,102,241,0.28);
  animation:spinRing 14s linear infinite;
}
@keyframes spinRing{to{transform:rotate(360deg);}}

.ring svg {
  width:clamp(26px,5.5vw,34px);
  height:clamp(26px,5.5vw,34px);
  stroke: rgba(99,102,241,0.75);
  fill:none;
  stroke-width:1.5;
}

.cam-idle p {
  font-size:var(--text-xs);
  color: rgba(99,102,241,0.60);
  font-family:'DM Mono',monospace;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

/* scan overlay corners */
.sov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
.sf {width:60%;aspect-ratio:1;position:relative;}
.co {position:absolute;width:26px;height:26px;}
.tl{top:0;left:0;border-top:3px solid #6366f1;border-left:3px solid #6366f1;border-radius:5px 0 0 0;}
.tr{top:0;right:0;border-top:3px solid #818cf8;border-right:3px solid #818cf8;border-radius:0 5px 0 0;}
.bl{bottom:0;left:0;border-bottom:3px solid #818cf8;border-left:3px solid #818cf8;border-radius:0 0 0 5px;}
.br{bottom:0;right:0;border-bottom:3px solid #f59e0b;border-right:3px solid #f59e0b;border-radius:0 0 5px 0;}

.beam {
  position:absolute;
  left:4%;right:4%;top:4%;
  height:2px;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,0.80) 25%,#fff 50%,rgba(245,158,11,0.80) 75%,transparent);
  border-radius:99px;
  box-shadow:0 0 16px 4px rgba(99,102,241,0.40);
  animation:beamMove 2.6s ease-in-out infinite;
}
@keyframes beamMove{0%,100%{top:4%;opacity:.9;}50%{top:88%;opacity:1;}}

/* status bar */
.sbar {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:11px;
  font-size:var(--text-xs);
  font-family:'DM Mono',monospace;
  color:var(--clr-muted);
  letter-spacing:.8px;
}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--clr-muted);}
.sbar.live{color:var(--clr-purple);}
.sbar.live .sdot{background:var(--clr-purple);box-shadow:0 0 6px var(--clr-purple2);animation:dotBlink2 1s infinite;}
@keyframes dotBlink2{50%{opacity:.15;}}

/* ══════════════════════════════
   BUTTONS — vibrant
══════════════════════════════ */
.btn {
  width:100%;
  padding:clamp(12px,2.5vw,15px) 20px;
  border:none;
  border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-size:var(--text-sm);
  font-weight:700;
  cursor:pointer;
  transition:all .25s cubic-bezier(.16,1,.3,1);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-top:13px;
  min-height:48px;
  letter-spacing:.4px;
  position:relative;
  overflow:hidden;
}

/* shimmer sweep on hover */
.btn::after {
  content:'';
  position:absolute;
  top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  transform:skewX(-20deg);
  transition:left .5s;
}
.btn:hover::after { left:160%; }

.btn-go {
  background:linear-gradient(135deg,#6366f1 0%,#1a56db 100%);
  color:#fff;
  box-shadow:0 6px 28px rgba(99,102,241,0.40),0 1px 0 rgba(255,255,255,0.20) inset;
}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(99,102,241,0.50);}

.btn-stop {
  background:rgba(220,38,38,0.08);
  color:var(--clr-red);
  border:1.5px solid rgba(220,38,38,0.30);
}
.btn-stop:hover{background:rgba(220,38,38,0.14);transform:translateY(-1px);}

.btn-again {
  background:rgba(99,102,241,0.08);
  color:var(--clr-purple);
  border:1.5px solid rgba(99,102,241,0.30);
}
.btn-again:hover{background:rgba(99,102,241,0.15);transform:translateY(-1px);}

/* ══════════════════════════════
   UPLOAD ZONE
══════════════════════════════ */
.uzone {
  position:relative;
  border:1.5px dashed rgba(99,102,241,0.28);
  border-radius:18px;
  padding:clamp(28px,5vw,44px) clamp(16px,3vw,24px);
  text-align:center;
  cursor:pointer;
  transition:all .25s;
  background:linear-gradient(135deg,rgba(248,250,255,0.80),rgba(240,244,255,0.60));
  overflow:hidden;
}

.uzone::before {
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,0.09),transparent 68%);
  opacity:0;
  transition:opacity .25s;
}
.uzone:hover::before,.uzone.dover::before{opacity:1;}
.uzone:hover,.uzone.dover {
  border-color:rgba(99,102,241,0.50);
  background:linear-gradient(135deg,rgba(248,250,255,0.95),rgba(235,240,255,0.85));
  transform:translateY(-2px);
  box-shadow:0 10px 36px rgba(99,102,241,0.14);
}

.uzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}

.uemoji {
  font-size:clamp(32px,7vw,46px);
  display:block;
  margin-bottom:14px;
  animation:floatEmoji 3.2s ease-in-out infinite;
}
@keyframes floatEmoji{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.uzone h3 {
  font-family:'Syne',sans-serif;
  font-size:clamp(14px,3vw,17px);
  font-weight:700;
  color:#1e293b;
  margin-bottom:6px;
}
.uzone p {
  font-size:var(--text-xs);
  color:var(--clr-muted);
  font-family:'DM Mono',monospace;
  letter-spacing:1px;
}

#imgprev {
  width:100%;
  max-height:180px;
  object-fit:contain;
  border-radius:12px;
  border:1px solid rgba(99,102,241,0.18);
  margin-top:14px;
  display:none;
  box-shadow:0 6px 24px rgba(99,102,241,0.12);
}

/* ══════════════════════════════
   RESULT BOXES
══════════════════════════════ */
#cam-result,#up-result{margin-top:18px;}

.rbox {
  border-radius:16px;
  padding:clamp(14px,3vw,20px);
  border:1px solid rgba(5,150,105,0.28);
  background:linear-gradient(135deg,rgba(5,150,105,0.08),rgba(34,197,94,0.03));
  box-shadow:0 4px 20px rgba(5,150,105,0.10);
  animation:resultIn .4s cubic-bezier(.16,1,.3,1);
  display:flex;
  flex-direction:column;
}
.rbox-err {
  border-radius:16px;
  padding:clamp(14px,3vw,20px);
  border:1px solid rgba(220,38,38,0.25);
  background:linear-gradient(135deg,rgba(220,38,38,0.07),rgba(248,113,113,0.02));
  animation:resultIn .4s cubic-bezier(.16,1,.3,1);
  display:flex;
  flex-direction:column;
}
@keyframes resultIn{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

.err-center{text-align:center;padding:20px 10px;}
.err-icon  {font-size:clamp(28px,6vw,38px);display:block;margin-bottom:12px;}
.err-title {font-family:'Syne',sans-serif;font-size:clamp(14px,3vw,16px);font-weight:700;color:#1e293b;margin-bottom:6px;}
.err-sub   {font-size:var(--text-xs);color:var(--clr-muted);line-height:1.6;}

/* ── SPINNER ── */
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:gSpin .65s linear infinite;display:inline-block;}
@keyframes gSpin{to{transform:rotate(360deg);}}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .admin-code-section{gap:8px;padding:10px 14px;}
  .admin-code-label{letter-spacing:1px;font-size:0.68rem;}
  .admin-code-input{letter-spacing:2px;font-size:15px;}
  .admin-code-input-wrap{min-width:120px;gap:6px;}
}
@media(max-width:400px){
  .tabs{gap:3px;}
  .tab{font-size:12px;padding:8px 6px;gap:4px;}
  .admin-code-section{flex-direction:column;align-items:flex-start;}
  .admin-code-input-wrap{width:100%;}
}
</style>
</head>
<body>

<div class="page">

  <!-- ── HEADER ── -->
  <div class="header">
    <div class="emblem-wrap">
      <div class="emblem">🗳️</div>
    </div>
    <h1>
      <span class="line1">Your Vote,</span>
      <span class="line2">Your Voice</span>
    </h1>
    <div class="tagline-wrap">
      <div class="tagline-line"></div>
      <span class="tagline">Scan your QR to cast your ballot</span>
      <div class="tagline-line r"></div>
    </div>
    <div class="dots-row">
      <div class="dot-badge"></div>
      <div class="dot-badge"></div>
      <div class="dot-badge"></div>
      <div class="dot-badge"></div>
      <div class="dot-badge"></div>
    </div>
  </div>

  <!-- ── ADMIN CODE ── -->
  <div class="admin-code-section" id="adminCodeSection">
    <span class="admin-code-label">Admin Code</span>
    <div class="admin-code-input-wrap">
      <input
        type="text"
        class="admin-code-input"
        id="adminCodeInput"
        placeholder="Enter admin code..."
        maxlength="20"
        autocomplete="off"
      >
      <span class="lock-icon" id="lockIcon">🔓</span>
    </div>
    <span class="admin-code-status waiting" id="adminCodeStatus">Waiting...</span>
  </div>

  <!-- ── MAIN CARD ── -->
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-cam" onclick="switchTab('camera')">📷 &nbsp;Camera</button>
      <button class="tab"        id="tab-up"  onclick="switchTab('upload')">🖼 &nbsp;Upload Image</button>
    </div>

    <!-- Camera Panel -->
    <div class="panel active" id="panel-camera">
      <div class="cam-wrap">
        <video id="videoEl" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="cam-idle" id="cam-idle">
          <div class="ring">
            <svg viewBox="0 0 24 24">
              <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <p>Camera off</p>
        </div>
        <div class="sov" id="sov">
          <div class="sf">
            <div class="co tl"></div><div class="co tr"></div>
            <div class="co bl"></div><div class="co br"></div>
            <div class="beam"></div>
          </div>
        </div>
      </div>
      <div class="sbar" id="cambar"><div class="sdot"></div><span>Ready — press Activate to start</span></div>
      <button class="btn btn-go" id="cambtn" onclick="toggleCam()">▶ &nbsp;Activate Camera</button>
      <button class="btn btn-again" id="flipbtn" onclick="flipCam()" style="display:none;">🔄 &nbsp;Switch Camera</button>
      <div id="cam-result"></div>
    </div>

    <!-- Upload Panel -->
    <div class="panel" id="panel-upload">
      <div class="uzone" id="dropzone">
        <input type="file" id="filein" accept="image/*"/>
        <span class="uemoji">🗳️</span>
        <h3>Drop your QR image here</h3>
        <p>PNG &nbsp;·&nbsp; JPG &nbsp;·&nbsp; WEBP &nbsp;·&nbsp; GIF</p>
      </div>
      <img id="imgprev" alt="preview"/>
      <div id="up-result"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/@zxing/library@latest"></script>
<script type="module">

const API = 'https://qr-authenticated-voting-system.onrender.com'

function switchTab(t) {
  document.getElementById('tab-cam').classList.toggle('active', t==='camera')
  document.getElementById('tab-up').classList.toggle('active',  t==='upload')
  document.getElementById('panel-camera').classList.toggle('active', t==='camera')
  document.getElementById('panel-upload').classList.toggle('active', t==='upload')
  if (t !== 'camera') stopCam()
}

function getAdminCodeFromField() {
  return document.getElementById('adminCodeInput').value.trim().toUpperCase()
}

function lockAdminCodeField(code) {
  const input=document.getElementById('adminCodeInput')
  const icon=document.getElementById('lockIcon')
  const status=document.getElementById('adminCodeStatus')
  input.value=code; input.disabled=true
  icon.textContent='🔒'
  status.textContent='From QR'; status.className='admin-code-status locked'
}

function unlockAdminCodeField() {
  const input=document.getElementById('adminCodeInput')
  const icon=document.getElementById('lockIcon')
  const status=document.getElementById('adminCodeStatus')
  input.disabled=false
  icon.textContent='🔓'
  status.textContent='Enter manually'; status.className='admin-code-status unlocked'
}

function resetAdminCodeField() {
  const input=document.getElementById('adminCodeInput')
  const icon=document.getElementById('lockIcon')
  const status=document.getElementById('adminCodeStatus')
  input.value=''; input.disabled=false
  icon.textContent='🔓'
  status.textContent='Waiting...'; status.className='admin-code-status waiting'
}

function resetAll(which) {
  resetAdminCodeField()
  if (which==='cam'||which==='all') {
    document.getElementById('cam-result').innerHTML=''
    found=false
    setBar('','Ready — press Activate to start')
    const btn=document.getElementById('cambtn')
    btn.innerHTML='▶ &nbsp;Activate Camera'; btn.className='btn btn-go'; btn.disabled=false
  }
  if (which==='up'||which==='all') {
    document.getElementById('up-result').innerHTML=''
    document.getElementById('imgprev').style.display='none'
    document.getElementById('imgprev').src=''
    document.getElementById('filein').value=''
  }
}

let stream=null,scanning=false,found=false,currentFacing='environment'

async function startStream(facing) {
  const v=document.getElementById('videoEl')
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  stream=await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ ideal:facing } }
  })
  v.srcObject=stream
  if(v.paused) await v.play()
  currentFacing=facing
}

async function toggleCam() {
  if (scanning){stopCam();return}
  const btn=document.getElementById('cambtn')
  btn.innerHTML='<span class="spin"></span>&nbsp; Starting…'; btn.disabled=true
  try {
    await startStream('environment')
    document.getElementById('cam-idle').style.display='none'
    document.getElementById('sov').style.display='flex'
    document.getElementById('cam-result').innerHTML=''
    scanning=true; found=false
    setBar('live','Scanning — hold QR code in front of the camera…')
    btn.innerHTML='⏹ &nbsp;Stop'; btn.className='btn btn-stop'; btn.disabled=false
    document.getElementById('flipbtn').style.display='flex'
    setTimeout(()=>requestAnimationFrame(tick),100)
  } catch(err) {
    btn.innerHTML='▶ &nbsp;Activate Camera'; btn.className='btn btn-go'; btn.disabled=false
    setBar('','Camera access denied or unavailable.')
  }
}

async function flipCam() {
  const flipbtn=document.getElementById('flipbtn')
  flipbtn.disabled=true
  const next=currentFacing==='environment' ? 'user' : 'environment'
  try {
    await startStream(next)
    setBar('live', next==='environment'
      ? 'Scanning — back camera active…'
      : 'Scanning — front camera active…')
  } catch(err) {
    setBar('','Could not switch camera.')
  }
  flipbtn.disabled=false
}

function stopCam() {
  scanning=false
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const v=document.getElementById('videoEl')
  v.srcObject=null
  document.getElementById('cam-idle').style.display='flex'
  document.getElementById('sov').style.display='none'
  setBar('','Camera stopped.')
  const btn=document.getElementById('cambtn')
  btn.innerHTML='▶ &nbsp;Activate Camera'; btn.className='btn btn-go'; btn.disabled=false
  document.getElementById('flipbtn').style.display='none'
}

function tick() {
  if(!scanning) return
  const v=document.getElementById('videoEl')
  const cv=document.getElementById('canvas')
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    const scale=2
    cv.width=v.videoWidth*scale; cv.height=v.videoHeight*scale
    const ctx=cv.getContext('2d',{willReadFrequently:true})
    ctx.imageSmoothingEnabled=false
    ctx.drawImage(v,0,0,cv.width,cv.height)
    const imgData=ctx.getImageData(0,0,cv.width,cv.height)
    const code=jsQR(imgData.data,cv.width,cv.height,{inversionAttempts:'attemptBoth'})
    if(code&&!found){found=true;stopCam();processQRText(code.data,'cam');return}
  }
  setTimeout(()=>requestAnimationFrame(tick),150)
}

function setBar(cls,txt) {
  const b=document.getElementById('cambar')
  b.className='sbar'+(cls?' '+cls:'')
  b.innerHTML='<div class="sdot"></div><span>'+txt+'</span>'
}

document.getElementById('filein').addEventListener('change',function(e){
  const f=e.target.files[0]; if(f) processFile(f)
})

const dz=document.getElementById('dropzone')
dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('dover')})
dz.addEventListener('dragleave',function(){dz.classList.remove('dover')})
dz.addEventListener('drop',function(e){
  e.preventDefault();dz.classList.remove('dover')
  const f=e.dataTransfer.files[0]
  if(f&&f.type.startsWith('image/')) processFile(f)
})

function processFile(file) {
  const reader=new FileReader()
  reader.onload=function(ev){
    const prev=document.getElementById('imgprev')
    prev.src=ev.target.result; prev.style.display='block'
    const img=new Image()
    img.onload=async function(){
      try {
        const codeReader=new ZXing.BrowserQRCodeReader()
        codeReader.decodeFromImageElement(img)
          .then(async result=>{await processQRText(result.text,'up')})
          .catch(async()=>{
            const cv=document.createElement('canvas')
            const ctx=cv.getContext('2d')
            cv.width=img.width; cv.height=img.height
            ctx.drawImage(img,0,0)
            const imgData=ctx.getImageData(0,0,cv.width,cv.height)
            const code=jsQR(imgData.data,cv.width,cv.height)
            if(code){await processQRText(code.data,'up')}
            else{showMessage('up-result','❌ No QR code found in this image.','error')}
          })
      } catch(e){showMessage('up-result','❌ Could not read image.','error')}
    }
    img.src=ev.target.result
  }
  reader.readAsDataURL(file)
}

async function processQRText(raw,which) {
  const clean=raw.trim()
  const parts=clean.split('|').map(p=>p.trim())
  let studentId='',studentName='',adminCode=''
  if(parts.length>=3){
    studentId=parts[0]; studentName=parts[1]; adminCode=parts[2].toUpperCase()
    lockAdminCodeField(adminCode)
  } else if(parts.length===2){
    studentId=parts[0]; studentName=parts[1]; adminCode=getAdminCodeFromField()
    unlockAdminCodeField()
  } else {
    studentId=parts[0]; adminCode=getAdminCodeFromField()
    unlockAdminCodeField()
  }
  if(!adminCode){
    showMessage(which+'-result','❌ Admin code required. Enter it above.','error')
    return
  }
  showMessage(which+'-result','⏳ Checking database...','loading')
  await checkStudent(studentId,studentName,adminCode,which)
}

async function checkStudent(studentId,studentName,adminCode,which) {
  const resultBoxId=which+'-result'
  showMessage(resultBoxId,'⏳ Checking database...','loading')
  const res=await fetch(`${API}/api/verify/student`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({studentId,studentName,adminCode})
  })
  const data=await res.json()
  if(!res.ok){showMessage(resultBoxId,'❌ '+data.error,'error');showScanAgainBtn(resultBoxId,which);return}
  showMessage(resultBoxId,'✅ Verified! Redirecting...','success')
  setTimeout(()=>window.location.href=data.url,2000)
}

function showMessage(boxId,message,type) {
  const box=document.getElementById(boxId)
  if(!box) return
  const colors={success:'#059669',error:'#dc2626',warning:'#d97706',loading:'#6366f1'}
  box.innerHTML=
    '<div class="rbox">'
    +'<div style="padding:28px 20px;text-align:center;font-size:15px;font-family:\'DM Sans\',sans-serif;font-weight:600;color:'
    +(colors[type]||'#0f172a')+'">'+message+'</div>'
    +'</div>'
}

function showScanAgainBtn(boxId,which) {
  const box=document.getElementById(boxId)
  if(!box) return
  const existing=box.querySelector('.rbox, .rbox-err')
  if(!existing) return
  const btn=document.createElement('button')
  btn.className='btn btn-again'
  btn.style.margin='0'
  btn.style.width='100%'
  btn.innerHTML='↺ &nbsp;Try Again'
  btn.onclick=()=>resetAll(which)
  existing.appendChild(btn)
}
window.switchTab=switchTab
window.toggleCam=toggleCam
window.flipCam=flipCam
window.resetAll=resetAll
</script>
</body>
</html>
